services:
  web:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Kuala_Lumpur
      - ENVIRONMENT=development
      - APP_HOST=0.0.0.0
      - APP_PORT=3000
      # Choose exactly one complete database target block.
      # Option A: local MySQL service on the Windows host (active)
      # - DB_SERVER=host.docker.internal
      # - DB_PORT=3306
      # - DB_SCHEMA=officeform
      # - DB_USER=root
      # - DB_PASSWORD=root

      # Option B: MySQL container in this Compose stack
      - DB_SERVER=db
      - DB_PORT=3306
      - DB_SCHEMA=officeform
      - DB_USER=officeform
      - DB_PASSWORD=myadmin

      # - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-officeformterplaingsecret}
      - AUTH_SHARED_PASSWORD=${AUTH_SHARED_PASSWORD:-abcd1234}
      - GOOGLE_SHEETS_ENABLED=${GOOGLE_SHEETS_ENABLED:-0}
      - GOOGLE_CREDENTIALS_PATH=/app/secrets/officeform-503804-a6af5cb4b3a4.json
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-1A1g37tUffmaVuj8PIcGU1-V0iq5fYpk3dVQVcXlcL4U}
      - GOOGLE_SHEET_TAB=${GOOGLE_SHEET_TAB:-2026}
      # ONLYOFFICE in-browser viewer for Office files in the Others tab
      - ONLYOFFICE_ENABLED=${ONLYOFFICE_ENABLED:-0}
      - ONLYOFFICE_PUBLIC_URL=${ONLYOFFICE_PUBLIC_URL:-http://localhost:9980}
      - ONLYOFFICE_INTERNAL_URL=http://web:3000
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-officeform-onlyoffice-secret}
      # MCP server service-login shared secret. Must equal the MCP server's
      # MCP_SERVICE_LOGIN_KEY in .env. Empty default = endpoint fails closed.
      - MCP_SERVICE_LOGIN_KEY=${MCP_SERVICE_LOGIN_KEY:-}
    ports:
      # Server
      - "80:3000"
      # Local
      # - "3000:3000"
    volumes:
      # - ./generated:/app/generated
      # - ./formOri:/app/formOri:ro
      # - ./others:/app/others
      # - ./secrets:/app/secrets:ro
      - ./:/app

  onlyoffice:
    image: onlyoffice/documentserver:latest
    environment:
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-officeform-onlyoffice-secret}
      # Required so the document server can download files from the private
      # web container address (ONLYOFFICE_INTERNAL_URL).
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - TZ=Asia/Kuala_Lumpur
    ports:
      - "9980:80"
    restart: unless-stopped

  db:
    image: mysql:8.4
    profiles:
      - docker-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-officeform}
      - MYSQL_USER=${MYSQL_USER:-officeform}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-myadmin}
      - TZ=Asia/Kuala_Lumpur
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_container_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_container_data:
