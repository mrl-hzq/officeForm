apiVersion: v1
kind: Namespace
metadata:
  name: officeform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: officeform-generated
  namespace: officeform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: officeform-others
  namespace: officeform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: officeform
  namespace: officeform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: officeform
  template:
    metadata:
      labels:
        app: officeform
    spec:
      containers:
        - name: officeform
          image: 100.95.211.72:5000/officeform:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: officeform-env
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: generated
              mountPath: /app/generated
            - name: others
              mountPath: /app/others
      volumes:
        - name: generated
          persistentVolumeClaim:
            claimName: officeform-generated
        - name: others
          persistentVolumeClaim:
            claimName: officeform-others
---
apiVersion: v1
kind: Service
metadata:
  name: officeform
  namespace: officeform
spec:
  type: ClusterIP
  selector:
    app: officeform
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: officeform
  namespace: officeform
spec:
  rules:
    - host: officeform.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: officeform
                port:
                  name: http
